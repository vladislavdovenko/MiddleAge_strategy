name: Windows build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot editor and Windows export template
        shell: pwsh
        run: |
          $release = "https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          $editor = "Godot_v4.7.2-stable_win64.exe.zip"
          $templates = "Godot_v4.7.2-stable_export_templates.tpz"
          Set-Location $env:RUNNER_TEMP
          foreach ($asset in @($editor, $templates)) {
            curl.exe -fsSL --retry 3 "$release/$asset" -o $asset
            if ($LASTEXITCODE) { throw "Download failed for $asset" }
          }
          Expand-Archive $editor godot
          $templateDir = "$env:APPDATA/Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          tar -xf $templates
          if ($LASTEXITCODE) { throw "Cannot extract Windows export template" }
          Copy-Item templates/* $templateDir -Recurse
          $editorPath = (Get-ChildItem godot -Recurse -Filter '*_console.exe' | Select-Object -First 1).FullName
          "GODOT_EDITOR=$editorPath" >> $env:GITHUB_ENV
      - name: Test and export
        shell: pwsh
        run: ./tools/build.ps1 -Godot $env:GODOT_EDITOR
      - name: Verify interactive map and capture close view
        shell: pwsh
        run: |
          & $env:GODOT_EDITOR --audio-driver Dummy --script res://tests/map_checks.gd -- --preview
          if ($LASTEXITCODE -ne 0 -or !(Test-Path map-preview.png)) { throw "Map preview test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: map-preview
          path: map-preview.png
      - name: Launch packaged game on Windows
        shell: pwsh
        run: |
          $p = Start-Process build/MiddleAge.exe -ArgumentList '--audio-driver','Dummy','--rendering-method','gl_compatibility','--quit-after','5','--log-file',"$env:RUNNER_TEMP/game.log" -PassThru
          if (!$p.WaitForExit(45000)) { $p.Kill(); throw 'Game timed out' }
          if ($p.ExitCode -ne 0) { throw "Game exited with $($p.ExitCode)" }
          if (!(Test-Path "$env:RUNNER_TEMP/game.log")) { throw 'Missing launch log' }
          Get-Content "$env:RUNNER_TEMP/game.log"
          if (Select-String "$env:RUNNER_TEMP/game.log" -Pattern 'SCRIPT ERROR|^ERROR:') { throw 'Startup log contains errors' }
      - name: Verify external PNG in the exported game
        shell: pwsh
        run: |
          $source = (Resolve-Path build/world.png).Path
          $initial = [IO.File]::ReadAllBytes($source)
          function Read-Region($log) {
            $p = Start-Process build/MiddleAge.exe -ArgumentList '--headless','--quit-after','4','--log-file',$log -PassThru
            if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Timed out' }
            $summary = Select-String -Path $log -Pattern 'REGION_READY ([a-f0-9]+) settlements=(\d+)'
            if ($p.ExitCode -ne 0 -or !$summary) { throw 'External map not loaded' }
            return $summary.Matches[0]
          }
          try {
            $before = Read-Region "$env:RUNNER_TEMP/before.log"
            Add-Type -AssemblyName System.Drawing
            $bmp = [Drawing.Bitmap]::FromFile($source)
            $bmp.SetPixel(2,2,[Drawing.Color]::FromArgb(212,125,134))
            $bmp.Save("$env:RUNNER_TEMP/modified.png",[Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Copy-Item "$env:RUNNER_TEMP/modified.png" $source -Force
            $after = Read-Region "$env:RUNNER_TEMP/after.log"
            if ($before.Groups[1].Value -eq $after.Groups[1].Value -or [int]$after.Groups[2].Value -ne (1+[int]$before.Groups[2].Value)) { throw 'New village did not appear' }
          } finally { [IO.File]::WriteAllBytes($source,$initial) }
      - uses: actions/upload-artifact@v4
        with:
          name: MiddleAge-painted-world-windows-x64
          path: build/
